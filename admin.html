<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Applications | J Pepe LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">
      <div class="brand-mark">J</div>
      <div class="brand-name">pepe.<span>J PEPE LLC</span></div>
    </a>
    <nav class="links">
      <a href="admin.html" style="border-bottom:2px solid var(--gold);">Applications</a>
      <a href="admin-jobs.html">Manage Jobs</a>
      <a href="careers.html">Careers</a>
    </nav>
    <a class="nav-cta" href="my-profile.html">My Profile</a>
  </div>
</header>

<section class="page-content" style="padding-top:120px;">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Admin</div>
      <h2>Candidate applications.</h2>
    </div>

    <div class="admin-filters">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="Submitted">Submitted</option>
        <option value="Under Review">Under Review</option>
        <option value="Interview">Interview</option>
        <option value="Offered">Offered</option>
        <option value="Hired">Hired</option>
        <option value="Rejected">Rejected</option>
      </select>
      <select id="jobFilter">
        <option value="">All positions</option>
      </select>
    </div>

    <div id="accessDenied" style="display:none;">
      <p style="color:var(--charcoal-soft);">You don't have access to this page.</p>
    </div>

    <div id="candidatesList"><p style="color:var(--charcoal-soft);">Loading...</p></div>
  </div>
</section>

<footer>
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <div class="brand-mark">J</div>
      J Pepe LLC — Call Center &amp; Bookkeeping Services
    </div>
        <div class="social-links">
      <a href="https://www.facebook.com/profile.php?id=61592609800990" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" class="icon-solid"><path d="M22 12a10 10 0 1 0-11.5 9.9v-7H7.9V12h2.6V9.8c0-2.6 1.5-4 3.9-4 1.1 0 2.3.2 2.3.2v2.5h-1.3c-1.3 0-1.7.8-1.7 1.6V12h2.9l-.5 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg></a>
      <a href="https://www.linkedin.com/company/143136119" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" class="icon-solid"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM3.5 8.75h3.9V21H3.5V8.75zm6.7 0h3.74v1.68h.05c.52-.98 1.8-2.02 3.7-2.02 3.96 0 4.69 2.6 4.69 6V21h-3.9v-5.9c0-1.4-.02-3.2-1.95-3.2-1.96 0-2.26 1.53-2.26 3.1V21h-3.9V8.75z"/></svg></a>
      <a href="https://www.instagram.com/fmphmultiservicesllc?igsh=eGdydDVuMGR2dzhu" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" class="icon-outline" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="var(--charcoal)" stroke="none"/></svg></a>
    </div>
    <div class="fine">&copy; <span id="year"></span> J Pepe LLC. All rights reserved.</div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const supabaseClient = getSupabaseClient();
  let allApplications = [];

  function escapeHtml(str){
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html?redirect=admin.html';
      return;
    }

    const { data: apps, error } = await supabaseClient
      .from('applications')
      .select('id, status, applied_at, cover_note, applicant_name, applicant_phone, education, experience, resume_url, voice_note_url, jobs(id, title, category), candidates(id, full_name, email, phone, photo_url, resume_url, experience, education, cover_letter)')
      .order('applied_at', { ascending: false });

    if (error) {
      document.getElementById('accessDenied').style.display = 'block';
      document.getElementById('candidatesList').innerHTML = '';
      return;
    }

    allApplications = apps || [];
    populateJobFilter();
    render();
  }

  function populateJobFilter(){
    const jobFilter = document.getElementById('jobFilter');
    const seen = new Set();
    allApplications.forEach(app => {
      if (app.jobs && !seen.has(app.jobs.id)) {
        seen.add(app.jobs.id);
        const opt = document.createElement('option');
        opt.value = app.jobs.id;
        opt.textContent = app.jobs.title;
        jobFilter.appendChild(opt);
      }
    });
  }

  function render(){
    const statusFilter = document.getElementById('statusFilter').value;
    const jobFilter = document.getElementById('jobFilter').value;
    const container = document.getElementById('candidatesList');

    const filtered = allApplications.filter(app => {
      if (statusFilter && app.status !== statusFilter) return false;
      if (jobFilter && app.jobs?.id !== jobFilter) return false;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color:var(--charcoal-soft);">No applications match this filter.</p>';
      return;
    }

    container.innerHTML = filtered.map(app => {
      const c = app.candidates || {};
      const photo = c.photo_url
        ? `<img src="${c.photo_url}" alt="">`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="var(--charcoal-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>`;

      const displayName = app.applicant_name || c.full_name || 'Unnamed candidate';
      const displayPhone = app.applicant_phone || c.phone;
      const displayEducation = app.education || c.education;
      const displayExperience = app.experience || c.experience;
      const displayResume = app.resume_url || c.resume_url;

      return `
      <div class="candidate-card">
        <div class="candidate-top">
          <div class="candidate-photo">${photo}</div>
          <div class="candidate-info">
            <h4>${escapeHtml(displayName)}</h4>
            <div class="meta-line">${escapeHtml(c.email || '')} ${displayPhone ? '&middot; ' + escapeHtml(displayPhone) : ''}</div>
            <div class="meta-line">Applied for: <strong>${escapeHtml(app.jobs?.title || '—')}</strong></div>
          </div>
        </div>
        <div class="candidate-detail-grid">
          <div><span class="label">Experience</span>${escapeHtml(displayExperience) || '<span style="color:var(--charcoal-soft);">Not provided</span>'}</div>
          <div><span class="label">Education</span>${escapeHtml(displayEducation) || '<span style="color:var(--charcoal-soft);">Not provided</span>'}</div>
        </div>
        ${app.cover_note ? `<div style="margin-bottom:10px;"><span class="label" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--charcoal-soft);">Why interested in this role</span><p style="font-size:13.5px;">${escapeHtml(app.cover_note)}</p></div>` : ''}
        ${c.cover_letter ? `<div style="margin-bottom:10px;"><span class="label" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--charcoal-soft);">General cover letter</span><p style="font-size:13.5px;">${escapeHtml(c.cover_letter)}</p></div>` : ''}
        ${app.voice_note_url ? `<div style="margin-bottom:10px;"><span class="label" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--charcoal-soft);">Voice introduction</span><audio controls src="${app.voice_note_url}" style="width:100%;margin-top:4px;"></audio></div>` : ''}
        <div class="candidate-actions">
          ${displayResume ? `<a class="btn btn-ghost" style="padding:8px 16px;font-size:13px;" href="${displayResume}" target="_blank" rel="noopener">View resume</a>` : ''}
          <select data-app-id="${app.id}" class="status-select">
            ${['Submitted','Under Review','Interview','Offered','Hired','Rejected'].map(s =>
              `<option value="${s}" ${app.status === s ? 'selected' : ''}>${s}</option>`
            ).join('')}
          </select>
          <span class="status-badge status-${(app.status || 'Submitted').replace(/\s+/g,'-')}">${escapeHtml(app.status || 'Submitted')}</span>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async function(){
        const appId = this.getAttribute('data-app-id');
        const newStatus = this.value;
        await supabaseClient.from('applications').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', appId);
        const app = allApplications.find(a => a.id === appId);
        if (app) app.status = newStatus;
        render();
      });
    });
  }

  document.getElementById('statusFilter').addEventListener('change', render);
  document.getElementById('jobFilter').addEventListener('change', render);

  init();
</script>

</body>
</html>
