<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — J Pepe LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">
      <div class="brand-mark">J</div>
      <div class="brand-name">pepe.<span>J PEPE LLC</span></div>
    </a>
    <nav class="links">
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="join-talent-community.html">Join Our Talent Community</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact Us</a>
    </nav>
    <a class="nav-cta" href="my-profile.html" style="background:var(--gold);color:var(--charcoal);">My Profile</a>
  </div>
</header>

<section class="auth-wrap" style="max-width:640px;">
  <div class="form-card">

    <div class="profile-header">
      <div>
        <h1 style="margin-bottom:2px;">My Profile</h1>
        <span class="user-email" id="userEmail"></span>
      </div>
      <button class="logout-link" id="logoutBtn">Log out</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="profileForm">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="+1 (___) ___-____">
      </div>
      <div class="form-group">
        <label for="category">Category you're interested in</label>
        <select id="category">
          <option value="">Select a category</option>
          <option value="Call Center">Call Center</option>
          <option value="Bookkeeping">Bookkeeping (QBOA)</option>
          <option value="Sales">Sales</option>
          <option value="Healthcare Support">Healthcare Support</option>
          <option value="Interpretation">Interpretation</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="coverNote">Tell us a bit about yourself</label>
        <textarea id="coverNote" placeholder="Experience, availability, languages spoken..."></textarea>
      </div>
      <div class="form-group">
        <label for="resumeFile">Resume / CV (PDF or Word)</label>
        <div class="file-drop" id="fileDropLabel">Click to choose a file, or drag it here</div>
        <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" style="display:none;">
        <div class="resume-current" id="resumeCurrent"></div>
      </div>
      <button type="submit" class="btn btn-primary form-submit" id="submitBtn">Save profile</button>
    </form>

  </div>
</section>

<footer>
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <div class="brand-mark">J</div>
      J Pepe LLC — Call Center &amp; Bookkeeping Services
    </div>
    <nav class="footer-links">
      <a href="about.html">About</a>
      <a href="careers.html">Careers</a>
      <a href="join-talent-community.html">Join Talent Community</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="my-profile.html">My Profile</a>
    </nav>
    <div class="fine">&copy; <span id="year"></span> J Pepe LLC. All rights reserved.</div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const supabase = getSupabaseClient();
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');
  let currentUser = null;
  let selectedFile = null;

  function showAlert(message, type){
    alertBox.textContent = message;
    alertBox.className = 'alert-box show ' + (type === 'error' ? 'alert-error' : 'alert-success');
  }

  async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;
    document.getElementById('userEmail').textContent = currentUser.email;

    const { data: profile } = await supabase
      .from('candidates')
      .select('*')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (profile) {
      document.getElementById('fullName').value = profile.full_name || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('category').value = profile.category || '';
      document.getElementById('coverNote').value = profile.cover_note || '';
      if (profile.resume_url) {
        document.getElementById('resumeCurrent').innerHTML =
          'Current file: <a href="' + profile.resume_url + '" target="_blank" rel="noopener">view uploaded resume</a>';
      }
    } else {
      document.getElementById('fullName').value = currentUser.user_metadata?.full_name || '';
    }
  }

  document.getElementById('fileDropLabel').addEventListener('click', function(){
    document.getElementById('resumeFile').click();
  });
  document.getElementById('resumeFile').addEventListener('change', function(e){
    selectedFile = e.target.files[0];
    if (selectedFile) {
      document.getElementById('fileDropLabel').textContent = selectedFile.name;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  document.getElementById('profileForm').addEventListener('submit', async function(e){
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Saving...';

    let resumeUrl = null;

    if (selectedFile) {
      const filePath = currentUser.id + '/' + Date.now() + '_' + selectedFile.name;
      const { error: uploadError } = await supabase.storage
        .from('resumes')
        .upload(filePath, selectedFile, { upsert: true });

      if (uploadError) {
        showAlert('Resume upload failed: ' + uploadError.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save profile';
        return;
      }

      const { data: urlData } = supabase.storage.from('resumes').getPublicUrl(filePath);
      resumeUrl = urlData.publicUrl;
    }

    const updatePayload = {
      id: currentUser.id,
      full_name: document.getElementById('fullName').value.trim(),
      email: currentUser.email,
      phone: document.getElementById('phone').value.trim(),
      category: document.getElementById('category').value,
      cover_note: document.getElementById('coverNote').value.trim(),
      updated_at: new Date().toISOString()
    };
    if (resumeUrl) updatePayload.resume_url = resumeUrl;

    const { error } = await supabase.from('candidates').upsert(updatePayload);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Save profile';

    if (error) {
      showAlert(error.message, 'error');
    } else {
      showAlert('Profile saved successfully.', 'success');
      if (resumeUrl) {
        document.getElementById('resumeCurrent').innerHTML =
          'Current file: <a href="' + resumeUrl + '" target="_blank" rel="noopener">view uploaded resume</a>';
      }
    }
  });

  init();
</script>

</body>
</html>
