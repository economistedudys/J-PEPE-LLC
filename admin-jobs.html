<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Jobs — J Pepe LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">
      <div class="brand-mark">J</div>
      <div class="brand-name">pepe.<span>J PEPE LLC</span></div>
    </a>
    <nav class="links">
      <a href="admin.html">Applications</a>
      <a href="admin-jobs.html" style="border-bottom:2px solid var(--gold);">Manage Jobs</a>
      <a href="careers.html">Careers</a>
    </nav>
    <a class="nav-cta" href="my-profile.html">My Profile</a>
  </div>
</header>

<section class="page-content" style="padding-top:120px;">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Admin</div>
      <h2>Manage job postings.</h2>
    </div>

    <div class="form-card" style="max-width:none;margin-bottom:36px;">
      <h1 id="formTitle" style="font-size:1.2rem;margin-bottom:18px;">Post a new position</h1>
      <div id="alertBox" class="alert-box"></div>
      <form id="jobForm">
        <input type="hidden" id="jobId">
        <div class="form-group">
          <label for="title">Job title</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Call Center">Call Center</option>
            <option value="Bookkeeping">Bookkeeping</option>
            <option value="Sales">Sales</option>
            <option value="Healthcare Support">Healthcare Support</option>
            <option value="Interpretation">Interpretation</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" value="Remote · Worldwide">
        </div>
        <div class="form-group">
          <label for="employmentType">Employment type</label>
          <select id="employmentType">
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Contract</option>
          </select>
        </div>
        <div class="form-group">
          <label for="schedule">Schedule (optional)</label>
          <input type="text" id="schedule" placeholder="e.g. Mon-Fri, 9am-5pm EST">
        </div>
        <div class="form-group">
          <label for="summary">Short summary (shown on the Careers list)</label>
          <input type="text" id="summary">
        </div>
        <div class="form-group">
          <label for="description">Full description</label>
          <textarea id="description" style="min-height:110px;"></textarea>
        </div>
        <div class="form-group">
          <label for="responsibilities">Responsibilities (one per line)</label>
          <textarea id="responsibilities" style="min-height:110px;"></textarea>
        </div>
        <div class="form-group">
          <label for="requirements">Requirements (one per line)</label>
          <textarea id="requirements" style="min-height:110px;"></textarea>
        </div>
        <div class="form-group">
          <label for="workingConditions">Working conditions (one per line)</label>
          <textarea id="workingConditions" style="min-height:110px;"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="isActive" checked style="width:auto;margin-right:8px;">Active (visible on Careers page)</label>
        </div>
        <button type="submit" class="btn btn-primary form-submit" id="submitBtn" style="max-width:260px;">Save position</button>
        <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;margin-top:10px;">Cancel edit</button>
      </form>
    </div>

    <h3 style="font-family:'Poppins',sans-serif;margin-bottom:16px;">All postings</h3>
    <div id="jobsList" class="job-list"><p style="color:var(--charcoal-soft);">Loading...</p></div>
  </div>
</section>

<footer>
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <div class="brand-mark">J</div>
      J Pepe LLC — Call Center &amp; Bookkeeping Services
    </div>
    <div class="fine">&copy; <span id="year"></span> J Pepe LLC. All rights reserved.</div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const supabase = getSupabaseClient();

  function escapeHtml(str){
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function showAlert(message, type){
    const box = document.getElementById('alertBox');
    box.textContent = message;
    box.className = 'alert-box show ' + (type === 'error' ? 'alert-error' : 'alert-success');
  }

  async function requireAuth(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = 'login.html?redirect=admin-jobs.html';
  }

  async function loadJobs(){
    const { data: jobs, error } = await supabase.from('jobs').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('jobsList');
    if (error) {
      container.innerHTML = '<p style="color:var(--charcoal-soft);">You may not have admin access, or no jobs exist yet.</p>';
      return;
    }
    if (!jobs || jobs.length === 0) {
      container.innerHTML = '<p style="color:var(--charcoal-soft);">No job postings yet — use the form above to add one.</p>';
      return;
    }
    container.innerHTML = jobs.map(job => `
      <div class="job-card">
        <div>
          <span class="job-cat">${escapeHtml(job.category)}</span>
          <div class="job-title">${escapeHtml(job.title)} ${job.is_active ? '' : '<span style="color:#B23A3A;font-size:12px;">(inactive)</span>'}</div>
          <div class="job-meta"><span>${escapeHtml(job.location || '')}</span><span>${escapeHtml(job.employment_type || '')}</span></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" style="padding:8px 16px;font-size:13px;" data-edit="${job.id}">Edit</button>
          <button class="btn btn-ghost" style="padding:8px 16px;font-size:13px;" data-toggle="${job.id}" data-active="${job.is_active}">${job.is_active ? 'Deactivate' : 'Activate'}</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => editJob(btn.getAttribute('data-edit'), jobs));
    });
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-toggle');
        const isActive = btn.getAttribute('data-active') === 'true';
        await supabase.from('jobs').update({ is_active: !isActive }).eq('id', id);
        loadJobs();
      });
    });
  }

  function editJob(id, jobs){
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    document.getElementById('formTitle').textContent = 'Edit position';
    document.getElementById('jobId').value = job.id;
    document.getElementById('title').value = job.title || '';
    document.getElementById('category').value = job.category || 'Call Center';
    document.getElementById('location').value = job.location || '';
    document.getElementById('employmentType').value = job.employment_type || 'Full-time';
    document.getElementById('schedule').value = job.schedule || '';
    document.getElementById('summary').value = job.summary || '';
    document.getElementById('description').value = job.description || '';
    document.getElementById('responsibilities').value = job.responsibilities || '';
    document.getElementById('requirements').value = job.requirements || '';
    document.getElementById('workingConditions').value = job.working_conditions || '';
    document.getElementById('isActive').checked = job.is_active;
    document.getElementById('cancelEditBtn').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('cancelEditBtn').addEventListener('click', function(){
    document.getElementById('jobForm').reset();
    document.getElementById('jobId').value = '';
    document.getElementById('formTitle').textContent = 'Post a new position';
    this.style.display = 'none';
  });

  document.getElementById('jobForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Saving...';

    const payload = {
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value,
      location: document.getElementById('location').value.trim(),
      employment_type: document.getElementById('employmentType').value,
      schedule: document.getElementById('schedule').value.trim(),
      summary: document.getElementById('summary').value.trim(),
      description: document.getElementById('description').value.trim(),
      responsibilities: document.getElementById('responsibilities').value.trim(),
      requirements: document.getElementById('requirements').value.trim(),
      working_conditions: document.getElementById('workingConditions').value.trim(),
      is_active: document.getElementById('isActive').checked
    };

    const jobId = document.getElementById('jobId').value;
    let error;
    if (jobId) {
      ({ error } = await supabase.from('jobs').update(payload).eq('id', jobId));
    } else {
      ({ error } = await supabase.from('jobs').insert(payload));
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Save position';

    if (error) {
      showAlert(error.message, 'error');
    } else {
      showAlert('Job posting saved.', 'success');
      document.getElementById('jobForm').reset();
      document.getElementById('jobId').value = '';
      document.getElementById('formTitle').textContent = 'Post a new position';
      document.getElementById('cancelEditBtn').style.display = 'none';
      loadJobs();
    }
  });

  (async function(){
    await requireAuth();
    loadJobs();
  })();
</script>

</body>
</html>
